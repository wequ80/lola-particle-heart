
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lola ✨</title>

<style>
* { margin: 0; padding: 0; }

body {
    background: #050209;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

.name {
    position: absolute;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    color: #ffb1df;
    font: bold 55px Georgia, serif;
    letter-spacing: 8px;
    text-shadow: 0 0 12px #ff40ac,
                 0 0 30px #ff40ac,
                 0 0 60px #ff168f;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div class="name">Lola</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H, S;
let particles = [];

const COUNT = 850;

function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    S = Math.min(W * 0.39, H * 0.39);
}

resize();
window.addEventListener("resize", resize);

// Heart formula
function heart(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3) / 17,
        y: (
            13 * Math.cos(t)
            - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t)
            - Math.cos(4*t)
        ) / 17
    };
}

// Create particles
for (let i = 0; i < COUNT; i++) {

    let t = Math.random() * Math.PI * 2;
    let r = Math.sqrt(Math.random());

    let p = heart(t);

    let angle = Math.random() * Math.PI * 2;
    let distance = 0.4 + Math.random() * 1.5;

    particles.push({
        tx: p.x * r,
        ty: p.y * r,

        sx: Math.cos(angle) * distance,
        sy: Math.sin(angle) * distance,

        phase: Math.random() * 10,
        speed: 0.5 + Math.random() * 2,

        size: 0.7 + Math.random() * 2.1,
        brightness: 0.5 + Math.random() * 0.5,

        color: Math.random()
    });
}

// Smooth transition
function smooth(t) {
    return t * t * (3 - 2 * t);
}

function animate(now) {

    requestAnimationFrame(animate);

    const time = now / 1000;

    // Continuous cycle
    const cycle = time % 8;

    let gather = 0;

    if (cycle < 2.8) {
        gather = smooth(cycle / 2.8);
    }
    else if (cycle < 3.8) {
        gather = 1;
    }
    else if (cycle < 6.6) {
        gather = 1 - smooth((cycle - 3.8) / 2.8);
    }

    // Glowing trails
    ctx.fillStyle = "rgba(5, 2, 9, 0.23)";
    ctx.fillRect(0, 0, W, H);

    const pulse = 1 + Math.sin(time * 3) * 0.025;

    const cx = W / 2;
    const cy = H * 0.43;

    particles.forEach((p, i) => {

        const wave = time * p.speed + p.phase;

        // Firefly wandering
        const wanderX =
            Math.sin(wave) * 0.035 +
            Math.cos(wave * 0.7) * 0.025;

        const wanderY =
            Math.cos(wave * 0.8) * 0.035;

        // Fly away or gather
        const x = p.sx * (1 - gather)
                + p.tx * gather;

        const y = p.sy * (1 - gather)
                + p.ty * gather;

        // Floating movement remains active
        const px = cx + (x + wanderX) * S * pulse;
        const py = cy - (y + wanderY) * S * pulse;

        // Firefly blinking
        const glow = Math.pow(
            (Math.sin(wave * 2) + 1) / 2,
            1.5
        );

        const radius = p.size * (0.55 + glow);

        const pink = p.color > 0.5;

        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);

        ctx.fillStyle = pink
            ? `rgba(255, ${100 + glow * 100}, ${175 + glow * 70}, ${0.35 + glow * 0.65})`
            : `rgba(255, 190, 225, ${0.3 + glow * 0.7})`;

        // Expensive glow only on selected particles
        if (i % 5 === 0) {
            ctx.shadowBlur = 12 + glow * 12;
            ctx.shadowColor = "#ff35a8";
        } else {
            ctx.shadowBlur = 0;
        }

        ctx.fill();
    });

    ctx.shadowBlur = 0;
}

requestAnimationFrame(animate);

</script>
</body>
</html>
